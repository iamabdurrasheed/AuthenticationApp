# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App log (equivalent of catalina.out for embedded Tomcat)
logging.file.name=logs/app.log
logging.level.root=INFO
logging.level.com.authapp=DEBUG
logging.level.org.apache.catalina=INFO
logging.level.org.apache.tomcat=INFO
logging.level.org.springframework.web=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Separate Catalina-style log for Tomcat internals only
logging.group.tomcat=org.apache.catalina,org.apache.tomcat
logging.level.tomcat=INFO

# JWT — always read from APP_JWT_SECRET environment variable
# Set it in .env (Docker) or setenv.sh (Tomcat) or IDE run config (local dev)
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
