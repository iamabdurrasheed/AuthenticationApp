version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authapp-backend
    ports:
      - "8080:8080"
    environment:
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - ./logs:/app/logs
    networks:
      - authapp-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/auth/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./auth-frontend
      dockerfile: Dockerfile
    container_name: authapp-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - authapp-network

networks:
  authapp-network:
    driver: bridge
